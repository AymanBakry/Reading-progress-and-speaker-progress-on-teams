<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Department - Reading & Speaker Progress Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            margin: 30px 0 20px;
            font-size: 1.5rem;
            color: var(--primary-color);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        .activities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .activity-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 5px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        .activity-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .activity-card.active {
            border-left-color: var(--accent-color);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 10px;
            background: #e0e7ff;
            color: var(--primary-color);
        }

        .activity-card.active .badge {
            background: #d1fae5;
            color: var(--accent-color);
        }

        .activity-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .activity-card p {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .activity-meta {
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        .btn-link {
            text-decoration: none;
            background: var(--primary-color);
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background: var(--secondary-color);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fas fa-graduation-cap"></i> English Department Tracker</h1>
            <p>Bi-Weekly Documentation for Reading Progress & Speaker Progress</p>
        </header>

        <main>
            <section>
                <h2 class="section-title"><i class="fas fa-tasks"></i> Current & Past Activities</h2>
                <div class="activities-grid" id="activities-container">
                    <!-- سيتم تعبئة الأنشطة تلقائياً عبر الجافاسكريبت -->
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 English Department. Hosted on GitHub Pages.</p>
        </footer>
    </div>

    <!-- ربط ملف الجافاسكريبت -->
    <script src="script.js"></script>
</body>
</html>
