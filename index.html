<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منصة متابعة القراءة والتحدث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"> <script>
  window.onerror = function (msg, src, line) {
    document.getElementById('app').innerHTML =
      '<div style="padding:20px;color:#b3261e;direction:ltr">' +
      'خطأ: ' + msg + ' (السطر ' + line + ')</div>';
  };
</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">متابعة القراءة والتحدث</a>
    <nav class="tools">
      <button class="btn ghost" id="btnExport">حفظ نسخة احتياطية</button>
      <label class="btn ghost" for="importInput">استرجاع نسخة</label>
      <input type="file" id="importInput" accept="application/json" hidden>
    </nav>
  </header>

  <main id="app"></main>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
