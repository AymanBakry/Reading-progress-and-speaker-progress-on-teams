<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدرسة البلاد القديم - متابعة القراءة والتحدث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.css">
  <link rel="stylesheet" href="style.css">

  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('app');
      if (box) {
        box.innerHTML = '<div style="padding:20px;color:#b3261e;direction:ltr;font-family:monospace">'
          + 'Error: ' + (e.message || 'failed to load a file')
          + (e.lineno ? ' (line ' + e.lineno + ')' : '') + '</div>';
      }
    }, true);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.umd.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/">
        <span class="school">مدرسة البلاد القديم الابتدائية الإعدادية للبنين</span>
        <span class="tag">متابعة القراءة والتحدث</span>
      </a>
      <nav class="tools">
        <button class="btn light" id="btnAuth">دخول المعلم</button>
      </nav>
    </div>
  </header>
  <div class="zig" aria-hidden="true"></div>

  <main id="app"></main>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
